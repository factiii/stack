name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm Trusted Publishing (OIDC). npm is restricting tokens that
  # bypass 2FA, and a granular token also just expires — this one did, which is
  # why publishes started failing with E404 on PUT (npm's way of saying "not
  # authorized" for a package that exists). With trusted publishing there is no
  # token to expire: npm verifies this workflow's OIDC identity instead.
  # Configure it once per package at npmjs.com > Settings > Trusted Publisher,
  # pointing at factiii/stack and this workflow file. A package without it
  # cannot publish at all now -- there is no token fallback left.
  id-token: write

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Node 22, not 20: @changesets/cli 3 declares node "^22.11 || ^24 || >=26"
      # and its bin calls module.enableCompileCache(), added in node 22.1. On
      # node 20 `changeset version` dies with "enableCompileCache is not a
      # function" before it versions anything.
      #
      # Trusted publishing needs npm >= 11.5.1 and node 22 ships npm 10. Pinned
      # to the 11 line rather than @latest so the npm major is a deliberate
      # choice rather than whatever npm ships today.
      - name: Use an npm that speaks OIDC
        run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - name: Check for changesets
        id: changesets
        run: |
          if ls .changeset/*.md 1>/dev/null 2>&1 && [ "$(ls .changeset/*.md | grep -v README.md)" ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm version-packages

      # No token. npm authenticates this job by its OIDC identity (trusted
      # publishing), configured per package at npmjs.com > Settings > Trusted
      # Publisher. The NPM_TOKEN secret this used to carry expired, which is
      # what E404-on-PUT means, and npm is retiring 2FA-bypass tokens anyway.
      - name: Publish to npm
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm release

      - name: Commit version bumps
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: version packages [skip ci]"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
